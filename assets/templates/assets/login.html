{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Swift ProSys Asset Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --swift-blue: #29ABE2; --swift-navy: #1c2b3a; --swift-orange: #F7941D; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top left, #24384b 0%, var(--swift-navy) 55%, #16222c 100%);
        }
        .login-card {
            width: 380px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .login-card img { max-width: 220px; margin: 0 auto 1.2rem; display: block; }
        .login-card h5 { color: var(--swift-navy); font-weight: 700; }
        .form-label { color: var(--swift-navy); font-size: .88rem; font-weight: 500; }
        .form-control {
            border: 1.5px solid #5a6675; border-radius: 10px;
            padding: .6rem .85rem; font-size: .95rem;
        }
        .form-control:focus {
            border-color: var(--swift-blue); box-shadow: 0 0 0 3px rgba(41,171,226,0.18);
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 2.6rem; }
        .password-toggle {
            position: absolute; top: 50%; right: .8rem; transform: translateY(-50%);
            background: none; border: none; color: #8a94a3; cursor: pointer; padding: 0;
        }
        .password-toggle:hover { color: var(--swift-blue); }
        .form-check-input {
            width: 1.15em; height: 1.15em; border: 1.5px solid #5a6675; margin-top: .18em;
        }
        .form-check-input:checked { background-color: var(--swift-blue); border-color: var(--swift-blue); }
        .form-check-input:focus { box-shadow: 0 0 0 3px rgba(41,171,226,0.18); }
        .form-check-label { font-size: .9rem; color: #2c3542; }
        .btn-login { background-color: var(--swift-blue); border-color: var(--swift-blue); }
        .btn-login:hover { background-color: #1f8bbf; }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <img src="{% static 'img/logo.jpg' %}" alt="Swift ProSys">
    <h5 class="text-center mb-3">Asset Register Login</h5>

    {% if form.errors %}
        <div class="alert alert-danger py-2">Invalid username or password.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="password-wrap">
                <input type="password" name="password" id="loginPassword" class="form-control" required>
                <button type="button" class="password-toggle" onclick="toggleLoginPassword()" aria-label="Show password">
                    <i class="bi bi-eye" id="loginPasswordIcon"></i>
                </button>
            </div>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" name="remember_me" id="rememberMe" class="form-check-input">
            <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-login w-100 text-white fw-semibold">Log In</button>
    </form>
</div>
<script>
    function toggleLoginPassword() {
        const input = document.getElementById('loginPassword');
        const icon = document.getElementById('loginPasswordIcon');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        icon.className = showing ? 'bi bi-eye' : 'bi bi-eye-slash';
    }
</script>
</body>
</html>
